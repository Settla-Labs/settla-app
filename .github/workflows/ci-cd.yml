name: Frontend CI/CD
on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  SERVICE_NAME: ikash-frontend-dev
  REGION: us-central1
  REPO_NAME: ikash-repo
  REGISTRY_URL: us-central1-docker.pkg.dev
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
  SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: latest
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --no-frozen-lockfile
    - run: pnpm run lint
    - run: pnpm run test
  build:
    name: Build Docker image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - run: "docker build \\\n  --build-arg NEXT_PUBLIC_API_URL=\"${{ secrets.NEXT_PUBLIC_API_URL\
        \ }}\" \\\n  --build-arg NEXT_PUBLIC_TRUSTLESS_WORK_API_URL=\"${{ secrets.NEXT_PUBLIC_TRUSTLESS_WORK_API_URL\
        \ }}\" \\\n  --build-arg NEXT_PUBLIC_TRUSTLESS_WORK_API_KEY=\"${{ secrets.NEXT_PUBLIC_TRUSTLESS_WORK_API_KEY\
        \ }}\" \\\n  --build-arg NEXT_PUBLIC_USDC_ISSUER=\"${{ secrets.NEXT_PUBLIC_USDC_ISSUER\
        \ }}\" \\\n  --build-arg NEXT_PUBLIC_STELLAR_NETWORK=\"${{ secrets.NEXT_PUBLIC_STELLAR_NETWORK\
        \ }}\" \\\n  -t ikash-frontend:ci .\n"
  deploy:
    name: Build & Deploy to Cloud Run
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
    - name: Diagnose WIF configuration
      run: 'echo "PROJECT_ID=${{ env.PROJECT_ID }}"

        echo "SERVICE_ACCOUNT=${{ env.SERVICE_ACCOUNT }}"

        echo "WIF_PROVIDER length: ${{ env.WIF_PROVIDER != '''' && ''set'' || ''EMPTY''
        }}"

        echo "WIF_PROVIDER format: $(echo ''${{ env.WIF_PROVIDER }}'' | grep -q ''^projects/''
        && echo ''OK (projects/...)'' || echo ''WARNING: should start with projects/'')"

        echo "Repository: ${{ github.repository }}"

        '
    - id: auth
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
      with:
        workload_identity_provider: ${{ env.WIF_PROVIDER }}
        service_account: ${{ env.SERVICE_ACCOUNT }}
    - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      with:
        version: latest
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
      with:
        node-version: 22
        cache: pnpm
    - run: pnpm install --no-frozen-lockfile
    - name: Authenticate Docker with Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGISTRY_URL }} --quiet
    - name: Build Docker image
      run: "IMAGE=\"${{ env.REGISTRY_URL }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME\
        \ }}/${{ env.SERVICE_NAME }}:${{ github.sha }}\"\ndocker build \\\n  --build-arg\
        \ NEXT_PUBLIC_API_URL=\"${{ secrets.NEXT_PUBLIC_API_URL }}\" \\\n  --build-arg\
        \ NEXT_PUBLIC_TRUSTLESS_WORK_API_URL=\"${{ secrets.NEXT_PUBLIC_TRUSTLESS_WORK_API_URL\
        \ }}\" \\\n  --build-arg NEXT_PUBLIC_TRUSTLESS_WORK_API_KEY=\"${{ secrets.NEXT_PUBLIC_TRUSTLESS_WORK_API_KEY\
        \ }}\" \\\n  --build-arg NEXT_PUBLIC_USDC_ISSUER=\"${{ secrets.NEXT_PUBLIC_USDC_ISSUER\
        \ }}\" \\\n  --build-arg NEXT_PUBLIC_STELLAR_NETWORK=\"${{ secrets.NEXT_PUBLIC_STELLAR_NETWORK\
        \ }}\" \\\n  -t $IMAGE .\ndocker tag $IMAGE \"${{ env.REGISTRY_URL }}/${{\
        \ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:latest\"\n\
        echo \"image=$IMAGE\" >> $GITHUB_ENV\n"
    - name: Push Docker image
      run: 'docker push "${{ env.REGISTRY_URL }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME
        }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"

        docker push "${{ env.REGISTRY_URL }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME
        }}/${{ env.SERVICE_NAME }}:latest"

        '
    - name: Deploy to Cloud Run
      run: "gcloud run deploy ${{ env.SERVICE_NAME }} \\\n  --image \"${{ env.REGISTRY_URL\
        \ }}/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{\
        \ github.sha }}\" \\\n  --platform managed \\\n  --region ${{ env.REGION }}\
        \ \\\n  --allow-unauthenticated \\\n  --timeout 1000 \\\n  --memory 2Gi \\\
        \n  --cpu 2\n"
permissions:
  contents: read
